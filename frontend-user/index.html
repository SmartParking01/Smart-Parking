<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Smart Parking</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/parking3d.css" />
</head>
<body>
  <div id="phone">

    <header id="app-header">
      <button id="btn-back" class="icon-btn" aria-label="Volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>

      <div class="brand" id="brand-title">
        <img id="app-logo" src="assets/logo.png" alt="Smart Parking"
             onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='inline-flex';" />
        <span id="logo-fallback" class="logo-fallback">P</span>
        <div class="brand-text">SMART<small>PARKING</small></div>
        <h1 id="header-title">Smart Parking</h1>
      </div>

      <span class="header-spacer"></span>
    </header>

    <main id="app-view"></main>

    <nav id="bottom-nav">
      <button data-route="#/home" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 11l9-8 9 8v10a2 2 0 01-2 2h-4v-6h-6v6H5a2 2 0 01-2-2z"/>
        </svg>
        <span>Inicio</span>
      </button>
      <button data-route="#/history" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span>Reservas</span>
      </button>
      <button data-route="#/profile" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
        </svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/parking-images.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/parking3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
