<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Smart Parking</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />

<!-- Leaflet: mapa geográfico gratuito (OpenStreetMap), sin API key -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="phone">
    <header id="app-header">
      <button id="btn-back" class="icon-btn" aria-label="Volver">Volver</button>
      <div class="brand" id="brand-title">
        <img id="app-logo" src="assets/logo.png" alt="Smart Parking" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='inline-flex';" />
        <span id="logo-fallback" class="logo-fallback">P</span>
        <h1 id="header-title">Smart Parking</h1>
      </div>
      <span class="header-spacer"></span>
    </header>

    <main id="app-view"></main>

    <nav id="bottom-nav">
      <button data-route="#/home" class="nav-btn"><span>Inicio</span></button>
      <button data-route="#/history" class="nav-btn"><span>Historial</span></button>
      <button data-route="#/profile" class="nav-btn"><span>Perfil</span></button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
